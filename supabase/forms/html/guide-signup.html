<form class="mgl-form" data-form="guide-signup" data-min-seconds="3" method="post" action="#" novalidate>
  <h2>Get the free MyGym guide</h2>
  <p class="intro">Part 1 of our Ultimate Fitness Startup guide: how we coach, a getting started checklist, goal setting and a 6 week challenge timeline.</p>
  <div class="field"><label for="guide-signup-full_name">First name <span class="req" aria-hidden="true">*</span></label><input type="text" name="full_name" id="guide-signup-full_name" maxlength="80" autocomplete="name" required aria-required="true"></div>
  <div class="field"><label for="guide-signup-email">Email address <span class="req" aria-hidden="true">*</span></label><input type="email" name="email" id="guide-signup-email" maxlength="120" autocomplete="email" required aria-required="true"></div>
  <input type="hidden" name="utm_source" id="guide-signup-utm_source">
  <input type="hidden" name="utm_medium" id="guide-signup-utm_medium">
  <input type="hidden" name="utm_campaign" id="guide-signup-utm_campaign">
  <input type="hidden" name="page_url" id="guide-signup-page_url">
  <div class="hp" aria-hidden="true"><label>Leave this field empty <input type="text" name="company_website" tabindex="-1" autocomplete="off"></label></div>
  <div class="consents"><label class="opt consent"><input type="checkbox" name="consent_marketing" value="1"> <span>Send me news and offers from MY GYM London by email. I can unsubscribe at any time.</span></label></div>
  <p class="privacy">We use your details to send you the guide. We only send news and offers if you tick the box. See our <a href="https://www.mygymlondon.co.uk/privacy">Privacy Notice</a>.</p>
  <button type="submit" class="btn">Email me the guide</button>
  <p class="status" role="status" aria-live="polite" data-success="Thanks! Your free guide is on its way. Please check your inbox, and your spam folder if it is not there in a few minutes."></p>
</form>
