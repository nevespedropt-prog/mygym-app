<form class="mgl-form" data-form="refer-a-friend" data-min-seconds="3" method="post" action="#" novalidate>
  <h2>Bring a friend</h2>
  <p class="intro">Invite a friend to come and see MY GYM London.</p>
  <div class="field"><label for="refer-a-friend-friend_name">Your friend's first name <span class="req" aria-hidden="true">*</span></label><input type="text" name="friend_name" id="refer-a-friend-friend_name" maxlength="40" required aria-required="true"></div>
  <div class="field"><label for="refer-a-friend-friend_email">Your friend's email <span class="req" aria-hidden="true">*</span></label><input type="email" name="friend_email" id="refer-a-friend-friend_email" maxlength="120" required aria-required="true"></div>
  <div class="field"><label for="refer-a-friend-message">Add a personal note (optional)</label><textarea name="message" id="refer-a-friend-message" rows="3" maxlength="300"></textarea></div>
  <div class="hp" aria-hidden="true"><label>Leave this field empty <input type="text" name="company_website" tabindex="-1" autocomplete="off"></label></div>
  <div class="consents"><label class="opt consent"><input type="checkbox" name="consent_friend_ok" value="1" required aria-required="true"> <span>My friend knows I am sending this invite. They will get one email from MY GYM London and no more unless they join. <span class="req" aria-hidden="true">*</span></span></label></div>
  <p class="privacy">We use your friend's email only to send this one invite. See our <a href="https://www.mygymlondon.co.uk/privacy">Privacy Notice</a>.</p>
  <button type="submit" class="btn">Send invite</button>
  <p class="status" role="status" aria-live="polite" data-success="Invite sent! We will let you know when your friend joins."></p>
</form>
