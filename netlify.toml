# MY GYM London app: Netlify settings (written 2026-10-20). Netlify serves only the app files (not supabase/, notes or scripts)
# and adds the security headers that GitHub Pages cannot send. GitHub Pages ignores this file (see _config.yml).

[build]
  command = "mkdir -p dist && cp index.html app.js db.js timetable.js config.js sw.js manifest.json cookies.html privacy.html terms.html email.html email.js dist/ && cp -r fonts icons vendor dist/ && cp -r f dist/ && cp _headers dist/"
  publish = "dist"

# Security headers are in the _headers file next to this one (that file is the one Netlify applies reliably).
