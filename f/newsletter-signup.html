<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Get news and offers | MY GYM London</title>
<link rel="stylesheet" href="forms.css">
</head>
<body>
<form class="mgl-form" data-form="newsletter-signup" data-min-seconds="3" method="post" action="#" novalidate>
  <h2>Get news and offers</h2>
  <p class="intro">Occasional updates, offers and class news. No spam.</p>
  <div class="field"><label for="newsletter-signup-first_name">First name (optional)</label><input type="text" name="first_name" id="newsletter-signup-first_name" maxlength="40"></div>
  <div class="field"><label for="newsletter-signup-email">Email address <span class="req" aria-hidden="true">*</span></label><input type="email" name="email" id="newsletter-signup-email" maxlength="120" autocomplete="email" required aria-required="true"></div>
  <input type="hidden" name="page_url" id="newsletter-signup-page_url">
  <div class="hp" aria-hidden="true"><label>Leave this field empty <input type="text" name="company_website" tabindex="-1" autocomplete="off"></label></div>
  <div class="consents"><label class="opt consent"><input type="checkbox" name="consent_marketing" value="1" required aria-required="true"> <span>Yes, send me news and offers from MY GYM London by email. I can unsubscribe at any time. <span class="req" aria-hidden="true">*</span></span></label></div>
  <p class="privacy">We will only email you if you confirm. See our <a href="https://www.mygymlondon.co.uk/privacy">Privacy Notice</a>.</p>
  <button type="submit" class="btn">Sign me up</button>
  <p class="status" role="status" aria-live="polite" data-success="Almost done! Please check your email and tap the confirm button."></p>
</form>
<script src="config.js"></script>
<script src="forms.js"></script>
</body>
</html>
