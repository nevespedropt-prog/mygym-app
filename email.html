<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Email preferences | MY GYM London</title>
<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url("fonts/barlow-condensed-700.woff2") format("woff2"); font-display: swap; }
  :root { --red: #e03939; --ink: #17171a; --mut: #62616a; --line: #e6e4e4; --bg: #f6f5f4; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.55 Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { width: 100%; max-width: 480px; background: #fff; border-top: 6px solid var(--red); padding: 32px 24px; }
  h1 { margin: 0 0 12px; font: 700 32px/1.1 "Barlow Condensed", "Arial Narrow", Arial, sans-serif; text-transform: uppercase; }
  p { margin: 0 0 16px; color: var(--mut); }
  a.btn { display: inline-block; background: var(--red); color: #fff; text-decoration: none; font-weight: 700; padding: 12px 24px; }
  button { font: inherit; font-weight: 700; background: var(--red); color: #fff; border: 0; padding: 12px 24px; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1 id="h">One moment</h1>
  <p id="p">Checking your link.</p>
  <div id="act"></div>
</main>
<script src="email.js"></script>
</body>
</html>
