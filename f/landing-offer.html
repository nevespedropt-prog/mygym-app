<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Claim this offer | MY GYM London</title>
<link rel="stylesheet" href="forms.css">
</head>
<body>
<form class="mgl-form" data-form="landing-offer" data-min-seconds="3" method="post" action="#" novalidate>
  <h2>Claim this offer</h2>
  <p class="intro">Leave your details and we will get you started.</p>
  <div class="field"><label for="landing-offer-full_name">Your name <span class="req" aria-hidden="true">*</span></label><input type="text" name="full_name" id="landing-offer-full_name" maxlength="80" autocomplete="name" required aria-required="true"></div>
  <div class="field"><label for="landing-offer-email">Email address <span class="req" aria-hidden="true">*</span></label><input type="email" name="email" id="landing-offer-email" maxlength="120" autocomplete="email" required aria-required="true"></div>
  <div class="field"><label for="landing-offer-phone">Phone number <span class="req" aria-hidden="true">*</span></label><input type="tel" name="phone" id="landing-offer-phone" maxlength="25" autocomplete="tel" inputmode="tel" required aria-required="true"></div>
  <input type="hidden" name="offer_name" id="landing-offer-offer_name">
  <input type="hidden" name="utm_source" id="landing-offer-utm_source">
  <input type="hidden" name="utm_medium" id="landing-offer-utm_medium">
  <input type="hidden" name="utm_campaign" id="landing-offer-utm_campaign">
  <input type="hidden" name="page_url" id="landing-offer-page_url">
  <div class="hp" aria-hidden="true"><label>Leave this field empty <input type="text" name="company_website" tabindex="-1" autocomplete="off"></label></div>
  <div class="consents"><label class="opt consent"><input type="checkbox" name="consent_marketing" value="1"> <span>Send me news and offers from MY GYM London by email. I can unsubscribe at any time.</span></label></div>
  <p class="privacy">We use your details only to reply to you. See our <a href="https://www.mygymlondon.co.uk/privacy">Privacy Notice</a>.</p>
  <button type="submit" class="btn">Send</button>
  <p class="status" role="status" aria-live="polite" data-success="Thanks, you are on the list. We will be in touch within one working day."></p>
</form>
<script src="config.js"></script>
<script src="forms.js"></script>
</body>
</html>
