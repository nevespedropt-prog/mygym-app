# MY GYM London app: Netlify settings (written 2026-10-20). Netlify serves only the app files (not supabase/, notes or scripts)
# and adds the security headers that GitHub Pages cannot send. GitHub Pages ignores this file (see _config.yml).

[build]
  command = "mkdir -p dist && cp index.html app.js db.js timetable.js config.js sw.js manifest.json cookies.html privacy.html terms.html email.html email.js dist/ && cp -r fonts icons vendor dist/ && cp _headers dist/"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

# fonts and icons used by our emails (CORS) are in the _headers file next to this one

# the service worker must never be cached, so app updates reach members straight away
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
