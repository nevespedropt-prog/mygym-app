<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Class cancelled | MY GYM admin</title>
<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 800; src: url("fonts/barlow-condensed-800.woff2") format("woff2"); font-display: swap; }
  :root { --red: #e03939; --deep: #a03535; --ink: #17171a; --mut: #62616a; --line: #e6e4e4; --bg: #f6f5f4; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.55 Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 560px; margin: 24px auto; background: #fff; border-top: 6px solid var(--red); padding: 28px 24px; }
  h1 { margin: 0 0 8px; font: 800 36px/1 "Barlow Condensed", "Arial Narrow", Arial, sans-serif; text-transform: uppercase; }
  p { margin: 0 0 14px; color: var(--mut); }
  label { display: block; font-weight: 600; font-size: 14.5px; margin: 14px 0 6px; }
  select, input { width: 100%; font: inherit; padding: 12px 14px; min-height: 48px; border: 1.5px solid #cfcdd1; background: #fff; border-radius: 0; }
  select:focus, input:focus, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  button { font: inherit; font-weight: 700; border: 0; padding: 12px 22px; margin: 18px 10px 0 0; cursor: pointer; background: var(--ink); color: #fff; }
  button.go { background: var(--red); }
  button[disabled] { opacity: .5; cursor: not-allowed; }
  .box { margin-top: 18px; padding: 14px 16px; background: var(--bg); border-left: 4px solid var(--red); color: var(--ink); }
  .box.err { background: #fdecec; border-color: var(--deep); }
  .box.ok { background: #e6f5ec; border-color: #238a52; }
  .hide { display: none; }
</style>
</head>
<body>
<main>
  <h1>Class cancelled</h1>
  <p>Emails everyone booked on a class to say it is cancelled. Do this <strong>first</strong>, then cancel the session in Wix (Wix removes the bookings).</p>
  <div id="gate" class="box hide"></div>
  <div id="form" class="hide">
    <label for="cls">Class</label>
    <select id="cls"></select>
    <label for="date">Date</label>
    <input id="date" type="date">
    <label for="reason">Reason (optional, shown in the email)</label>
    <input id="reason" type="text" maxlength="200" placeholder="For example: our coach is unwell">
    <button id="check" type="button">Check who is booked</button>
    <button id="send" type="button" class="go" disabled>Email them</button>
    <div id="out" class="box hide" role="status" aria-live="polite"></div>
  </div>
</main>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="admin-notify.js"></script>
</body>
</html>
